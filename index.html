<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#4b6969">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="top">
      <div class="score">
        <strong id="score">0</strong>
        <span>Score</span>
      </div>
      <div class="best">
        <strong id="best">0</strong>
        <span>Your Best</span>
      </div>
    </header>

    <section class="highscores">
      <div class="hs-title">HIGH SCORES</div>
      <div class="tabs">
        <span class="active">Today</span>
        <span>Weekly</span>
        <span>AllTime</span>
      </div>
      <div class="records">
        <div><b id="todayScore">0</b><small>by You</small></div>
        <div><b id="weeklyScore">0</b><small>by You</small></div>
        <div><b id="allTimeScore">0</b><small>by You</small></div>
      </div>
    </section>

    <section class="board-wrap" id="boardWrap">
      <canvas id="board"></canvas>

      <div class="start-screen" id="startScreen">
        <div class="start-card">
          <div class="logo">SNAKE</div>
          <div class="subtitle">classic</div>
          <button id="playBtn">JOGAR</button>
          <div class="hint">Use as setas, WASD ou deslize</div>
        </div>
      </div>

      <div class="game-over" id="gameOver">
        <div class="over-card">
          <div class="over-title">GAME OVER</div>
          <div class="final-label">SCORE</div>
          <div class="final-score" id="finalScore">0</div>
          <button id="againBtn">JOGAR NOVAMENTE</button>
          <button class="secondary" id="menuBtn">MENU</button>
        </div>
      </div>
    </section>

    <div class="touch-controls" aria-label="Controles">
      <button data-dir="up" class="up">▲</button>
      <button data-dir="left" class="left">◀</button>
      <button data-dir="down" class="down">▼</button>
      <button data-dir="right" class="right">▶</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
