<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Snake Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="menu" class="screen">
    <div class="card">
      <div class="logo">🐍</div>
      <h1>SNAKE</h1>
      <p>MULTIPLAYER</p>
      <input id="nameInput" maxlength="16" placeholder="Seu nome" autocomplete="off">
      <button id="playButton">JOGAR</button>
      <small>Até 10 jogadores por sala</small>
    </div>
  </main>

  <main id="game" class="hidden">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <div class="playerInfo"><span id="crown">👑</span><span id="playerName">Jogador</span></div>
      <div class="stats"><span id="score">0</span> pts</div>
      <div class="room">🟢 <span id="roomCount">1</span>/10</div>
    </div>

    <div id="leaderboard" class="leaderboard"></div>

    <div id="joystick" aria-label="Controles">
      <div class="stick">●</div>
    </div>
  </main>

  <div id="death" class="overlay hidden">
    <div class="card">
      <div class="logo">💀</div>
      <h2>VOCÊ MORREU</h2>
      <p><span id="finalScore">0</span> pontos</p>
      <p><span id="finalRank">-</span>º lugar</p>
      <button id="againButton">JOGAR NOVAMENTE</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
